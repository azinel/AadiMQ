<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AadiMQ - Distributed Job Queue Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .live-dot { animation: pulse-dot 1.5s infinite; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [queues, setQueues] = useState([]);
      const [workers, setWorkers] = useState([]);
      const [recentJobs, setRecentJobs] = useState([]);
      const [health, setHealth] = useState({ status: 'connecting' });
      const [loading, setLoading] = useState(true);

      // New Job Form State
      const [jobType, setJobType] = useState('email:send');
      const [queueName, setQueueName] = useState('default');
      const [priority, setPriority] = useState(0);
      const [delayMs, setDelayMs] = useState(0);
      const [payload, setPayload] = useState('{"to": "user@example.com", "subject": "Welcome!"}');
      const [submitting, setSubmitting] = useState(false);
      const [message, setMessage] = useState(null);

      const fetchData = async () => {
        try {
          const [qRes, wRes, jRes, hRes] = await Promise.all([
            fetch('/api/queues').then(r => r.json()),
            fetch('/api/workers').then(r => r.json()),
            fetch('/api/jobs?limit=10').then(r => r.json()),
            fetch('/api/health').then(r => r.json())
          ]);

          if (qRes.success) setQueues(qRes.data);
          if (wRes.success) setWorkers(wRes.data);
          if (jRes.success) setRecentJobs(jRes.data);
          setHealth(hRes);
        } catch (err) {
          console.error("Dashboard poll error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 2000);
        return () => clearInterval(interval);
      }, []);

      const handleCreateJob = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        setMessage(null);
        try {
          let parsedPayload = {};
          try { parsedPayload = JSON.parse(payload); } catch (e) {
            setMessage({ type: 'error', text: 'Invalid JSON payload format' });
            setSubmitting(false);
            return;
          }

          const res = await fetch('/api/jobs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              queueName,
              jobType,
              priority: Number(priority),
              delayMs: Number(delayMs),
              payload: parsedPayload,
            }),
          });
          const json = await res.json();
          if (res.ok) {
            setMessage({ type: 'success', text: `Job created! ID: ${json.data.id}` });
            fetchData();
          } else {
            setMessage({ type: 'error', text: json.message || 'Failed to submit job' });
          }
        } catch (err) {
          setMessage({ type: 'error', text: err.message });
        } finally {
          setSubmitting(false);
        }
      };

      const handleRetryJob = async (id) => {
        try {
          const res = await fetch(`/api/jobs/${id}/retry`, { method: 'POST' });
          if (res.ok) {
            fetchData();
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Aggregates
      const totalWaiting = queues.reduce((a, q) => a + (q.counts?.waiting || 0), 0);
      const totalActive = queues.reduce((a, q) => a + (q.counts?.active || 0), 0);
      const totalCompleted = queues.reduce((a, q) => a + (q.counts?.completed || 0), 0);
      const totalDLQ = queues.reduce((a, q) => a + (q.counts?.deadLetter || 0), 0);

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          {/* Header */}
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-800 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="text-2xl font-black bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">
                  AadiMQ
                </span>
                <span className="text-xs uppercase tracking-widest bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700">
                  Engine Core
                </span>
              </div>
              <p className="text-slate-400 text-sm mt-1">Distributed Job Queue System - Live Monitor</p>
            </div>
            
            <div className="flex items-center gap-4 text-xs">
              <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                <span className={`w-2.5 h-2.5 rounded-full live-dot ${health.status === 'ok' ? 'bg-emerald-400' : 'bg-red-500'}`}></span>
                <span className="font-medium text-slate-300">Cluster: {health.status}</span>
              </div>
              <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                <i className="fa-solid fa-server text-indigo-400"></i>
                <span className="text-slate-300">Workers: {workers.filter(w => w.status === 'ONLINE').length} Online</span>
              </div>
            </div>
          </div>

          {/* Metric Cards */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
            <div className="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl">
              <div className="text-slate-400 text-xs font-semibold uppercase tracking-wider">Waiting Jobs</div>
              <div className="text-3xl font-bold text-amber-400 mt-1">{totalWaiting}</div>
              <div className="text-xs text-slate-500 mt-1">Ready for execution</div>
            </div>
            <div className="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl">
              <div className="text-slate-400 text-xs font-semibold uppercase tracking-wider">Active Leases</div>
              <div className="text-3xl font-bold text-blue-400 mt-1">{totalActive}</div>
              <div className="text-xs text-slate-500 mt-1">In-flight across workers</div>
            </div>
            <div className="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl">
              <div className="text-slate-400 text-xs font-semibold uppercase tracking-wider">Completed</div>
              <div className="text-3xl font-bold text-emerald-400 mt-1">{totalCompleted}</div>
              <div className="text-xs text-slate-500 mt-1">Durable DB recorded</div>
            </div>
            <div className="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl">
              <div className="text-slate-400 text-xs font-semibold uppercase tracking-wider">Dead Letter Queue</div>
              <div className="text-3xl font-bold text-rose-400 mt-1">{totalDLQ}</div>
              <div className="text-xs text-slate-500 mt-1">Exhausted max retries</div>
            </div>
          </div>

          {/* Main Content Layout */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-8">
            {/* Left 2 Cols: Queues & Workers */}
            <div className="lg:col-span-2 space-y-8">
              {/* Queue Breakdown Table */}
              <div className="bg-slate-800/40 border border-slate-700/60 rounded-xl overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-700/60 flex justify-between items-center">
                  <h2 className="font-semibold text-slate-200 text-sm flex items-center gap-2">
                    <i className="fa-solid fa-layer-group text-indigo-400"></i> Active Queues Breakdown
                  </h2>
                  <span className="text-xs text-slate-400">{queues.length} queue(s)</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-slate-800/70 text-slate-400 uppercase tracking-wider text-[10px]">
                      <tr>
                        <th className="px-5 py-3">Queue</th>
                        <th className="px-4 py-3 text-amber-300">Waiting</th>
                        <th className="px-4 py-3 text-blue-300">Active</th>
                        <th className="px-4 py-3 text-purple-300">Delayed</th>
                        <th className="px-4 py-3 text-rose-300">DLQ</th>
                        <th className="px-4 py-3 text-emerald-300">Completed</th>
                        <th className="px-4 py-3">Avg Latency</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700/40 font-mono">
                      {queues.map((q) => (
                        <tr key={q.queueName} className="hover:bg-slate-800/30">
                          <td className="px-5 py-3 font-semibold text-slate-200">{q.queueName}</td>
                          <td className="px-4 py-3">{q.counts.waiting}</td>
                          <td className="px-4 py-3">{q.counts.active}</td>
                          <td className="px-4 py-3">{q.counts.delayed}</td>
                          <td className="px-4 py-3">{q.counts.deadLetter}</td>
                          <td className="px-4 py-3">{q.counts.completed}</td>
                          <td className="px-4 py-3 text-slate-400">{q.latency?.avgMs || 0} ms</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Workers Status Table */}
              <div className="bg-slate-800/40 border border-slate-700/60 rounded-xl overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-700/60 flex justify-between items-center">
                  <h2 className="font-semibold text-slate-200 text-sm flex items-center gap-2">
                    <i className="fa-solid fa-microchip text-indigo-400"></i> Worker Registry & Heartbeats
                  </h2>
                  <span className="text-xs text-slate-400">{workers.length} registered</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-slate-800/70 text-slate-400 uppercase tracking-wider text-[10px]">
                      <tr>
                        <th className="px-5 py-3">Worker ID</th>
                        <th className="px-4 py-3">Status</th>
                        <th className="px-4 py-3">Host / PID</th>
                        <th className="px-4 py-3">Concurrency</th>
                        <th className="px-4 py-3">Active Jobs</th>
                        <th className="px-4 py-3">Last Heartbeat</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700/40">
                      {workers.length === 0 ? (
                        <tr><td colSpan="6" className="text-center py-4 text-slate-500">No registered workers found</td></tr>
                      ) : (
                        workers.map((w) => (
                          <tr key={w.id} className="hover:bg-slate-800/30">
                            <td className="px-5 py-3 font-mono font-medium text-slate-200">{w.id}</td>
                            <td className="px-4 py-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${w.status === 'ONLINE' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}`}>
                                {w.status}
                              </span>
                            </td>
                            <td className="px-4 py-3 font-mono text-slate-400">{w.hostname} ({w.pid})</td>
                            <td className="px-4 py-3 font-mono">{w.concurrency}</td>
                            <td className="px-4 py-3 font-mono text-blue-400">{w.activeJobs}</td>
                            <td className="px-4 py-3 text-slate-400 text-[11px]">{new Date(w.lastHeartbeat).toLocaleTimeString()}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Recent Jobs Audit Trail */}
              <div className="bg-slate-800/40 border border-slate-700/60 rounded-xl overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-700/60 flex justify-between items-center">
                  <h2 className="font-semibold text-slate-200 text-sm flex items-center gap-2">
                    <i className="fa-solid fa-clock-rotate-left text-indigo-400"></i> Recent Jobs
                  </h2>
                  <span className="text-xs text-slate-400">Latest 10</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-slate-800/70 text-slate-400 uppercase tracking-wider text-[10px]">
                      <tr>
                        <th className="px-5 py-3">Job ID</th>
                        <th className="px-4 py-3">Type</th>
                        <th className="px-4 py-3">Status</th>
                        <th className="px-4 py-3">Attempts</th>
                        <th className="px-4 py-3">Created</th>
                        <th className="px-4 py-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700/40 font-mono">
                      {recentJobs.length === 0 ? (
                        <tr><td colSpan="6" className="text-center py-4 text-slate-500">No jobs submitted yet</td></tr>
                      ) : (
                        recentJobs.map((j) => (
                          <tr key={j.id} className="hover:bg-slate-800/30">
                            <td className="px-5 py-3 font-semibold text-slate-300">{j.id.slice(0, 8)}...</td>
                            <td className="px-4 py-3 text-indigo-300 font-sans">{j.jobType}</td>
                            <td className="px-4 py-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                j.status === 'COMPLETED' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                                j.status === 'ACTIVE' ? 'bg-blue-950 text-blue-400 border border-blue-800' :
                                j.status === 'WAITING' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                                j.status === 'DELAYED' ? 'bg-purple-950 text-purple-400 border border-purple-800' :
                                'bg-rose-950 text-rose-400 border border-rose-800'
                              }`}>
                                {j.status}
                              </span>
                            </td>
                            <td className="px-4 py-3">{j.attempts} / {j.maxAttempts}</td>
                            <td className="px-4 py-3 text-slate-400 text-[11px] font-sans">{new Date(j.createdAt).toLocaleTimeString()}</td>
                            <td className="px-4 py-3 text-right">
                              {j.status === 'DEAD_LETTER' && (
                                <button 
                                  onClick={() => handleRetryJob(j.id)}
                                  className="px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-[10px] transition"
                                >
                                  Retry
                                </button>
                              )}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            {/* Right Col: Submit New Job Console */}
            <div className="bg-slate-800/40 border border-slate-700/60 rounded-xl p-6 h-fit">
              <h2 className="font-semibold text-slate-200 text-sm flex items-center gap-2 mb-4">
                <i className="fa-solid fa-paper-plane text-indigo-400"></i> Submit Job Console
              </h2>

              {message && (
                <div className={`p-3 rounded-lg text-xs mb-4 ${message.type === 'success' ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800' : 'bg-rose-950/80 text-rose-300 border border-rose-800'}`}>
                  {message.text}
                </div>
              )}

              <form onSubmit={handleCreateJob} className="space-y-4 text-xs">
                <div>
                  <label className="block text-slate-400 mb-1 font-medium">Queue Name</label>
                  <input
                    type="text"
                    value={queueName}
                    onChange={(e) => setQueueName(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500"
                    required
                  />
                </div>

                <div>
                  <label className="block text-slate-400 mb-1 font-medium">Job Type</label>
                  <input
                    type="text"
                    value={jobType}
                    onChange={(e) => setJobType(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500"
                    required
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">Priority (0-100)</label>
                    <input
                      type="number"
                      value={priority}
                      onChange={(e) => setPriority(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">Delay (ms)</label>
                    <input
                      type="number"
                      value={delayMs}
                      onChange={(e) => setDelayMs(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-slate-400 mb-1 font-medium">JSON Payload</label>
                  <textarea
                    rows="4"
                    value={payload}
                    onChange={(e) => setPayload(e.target.value)}
                    className="w-full font-mono bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500"
                  ></textarea>
                </div>

                <button
                  type="submit"
                  disabled={submitting}
                  className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-2 rounded transition shadow-lg shadow-indigo-900/30 disabled:opacity-50"
                >
                  {submitting ? 'Enqueueing...' : 'Enqueue Job'}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
